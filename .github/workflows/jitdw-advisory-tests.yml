name: JIT-DW advisory prototype
on:
  pull_request:
    paths:
      - 'tools/jitdw_advisor.py'
      - 'tests/test_jitdw_advisor.py'
      - 'validation/pilots/codex-astrbot/**'
      - '.github/workflows/jitdw-advisory-tests.yml'
  push:
    branches: [main]
    paths:
      - 'tools/jitdw_advisor.py'
      - 'tests/test_jitdw_advisor.py'
      - 'validation/pilots/codex-astrbot/**'
      - '.github/workflows/jitdw-advisory-tests.yml'
permissions:
  contents: read
jobs:
  advisory-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test prototype with no third-party Python dependencies
        run: python -m unittest discover -s tests -p 'test_jitdw_advisor.py' -v
      - name: Inspect one upstream fixture
        run: python tools/jitdw_advisor.py --profile astrbot --input validation/pilots/codex-astrbot/fixtures/astrbot-reload-pr10788.json --format markdown
