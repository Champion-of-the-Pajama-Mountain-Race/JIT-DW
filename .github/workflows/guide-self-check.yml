name: JIT-DW Guide editorial smoke test

# Maintains this repository's own links and runnable examples.
# Not a requirement imposed on projects adopting the Guide.
on:
  pull_request:
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'guide/**'
      - 'docs/project-brief.md'
      - 'docs/decisions/**'
      - 'research/round-4/**'
      - 'validation/pilots/bot-r-a-d/**'
      - 'tests/test_guide_examples.py'
      - 'tools/check_guide.py'
      - '.github/workflows/guide-self-check.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'guide/**'
      - 'docs/project-brief.md'
      - 'docs/decisions/**'
      - 'research/round-4/**'
      - 'validation/pilots/bot-r-a-d/**'
      - 'tests/test_guide_examples.py'
      - 'tools/check_guide.py'
      - '.github/workflows/guide-self-check.yml'
permissions:
  contents: read
jobs:
  guide-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check local Guide navigation and Markdown fences
        run: python tools/check_guide.py
      - name: Run documented Python examples
        run: python -m unittest discover -s tests -p 'test_guide_examples.py' -v
